server:
  port: 8200
  error:
    include-stacktrace: never
    include-message: never
spring:
  application:
    name: bank-account
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 10000
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
management:
  endpoints:
    web:
      exposure:
        include: health,info
soas:
  internal-key: ${INTERNAL_SERVICE_KEY:soas-local-internal-change-me}
  gateway-key: ${GATEWAY_SERVICE_KEY:soas-local-gateway-change-me}
---
spring:
  datasource:
    url: jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

